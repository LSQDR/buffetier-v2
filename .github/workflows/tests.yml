name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hermetic:
    name: Lint and hermetic pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff==0.17.1

      - name: Lint with Ruff
        run: ruff check .

      - name: Collect the suite with no database
        env:
          SECRET_KEY: test-only-not-for-production
        run: |
          unset DATABASE_URL || true
          unset MONGO_URI || true
          python -m pytest --collect-only -q

      - name: Run tests that do not need Neon or Atlas
        env:
          SECRET_KEY: test-only-not-for-production
        run: |
          unset DATABASE_URL || true
          unset MONGO_URI || true
          python -m pytest -m "not live_db" -q

  full:
    name: Full pytest against PostgreSQL and MongoDB
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: buffetier
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: test-only-not-for-production
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/buffetier
      MONGO_URI: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create the schema and seed test data
        run: python -m database.seed_test_data

      - name: Run the whole suite
        run: python -m pytest -q
