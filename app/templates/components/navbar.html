
<div class="navbar">
    <a href="{{ url_for('main.index') }}" class="navbar-brand">
        <span>🍽️ Buffetier</span>
    </a>
    
    <div class="navbar-links">
        <a href="{{ url_for('main.index') }}">
            <i class="bi bi-house-door"></i> Home
        </a>
        
        {% if session.get('user_id') %}
        <a href="{{ url_for('main.menu') }}">
            <i class="bi bi-menu-app"></i> Menu
        </a>
        
        <a href="{{ url_for('orders.cart') }}" class="cart-link">
            <i class="bi bi-cart-fill"></i> Cart
            <span class="cart-badge" id="cart-count" style="display: none;">0</span>
        </a>
        
        <a href="{{ url_for('main.location') }}">
            <i class="bi bi-geo-alt"></i> Location
        </a>
        
        <a href="{{ url_for('reviews.reviews_page') }}">
            <i class="bi bi-star"></i> Reviews
        </a>
        
        <!-- Admin Dropdown -->
        {% if session.get('is_admin') %}
        <div class="dropdown">
            <div class="dropdown-toggle" onclick="toggleDropdown(event)">
                Admin
            </div>
            <div class="dropdown-menu" id="adminDropdown">
                <a href="{{ url_for('admin.admin_dashboard') }}">
                    <i class="bi bi-speedometer2"></i> Dashboard
                </a>
                <a href="{{ url_for('admin.admin_menu') }}">
                    <i class="bi bi-book"></i> Manage Menu
                </a>
                <a href="{{ url_for('admin.admin_reviews') }}">
                    <i class="bi bi-star"></i> Manage Reviews
                </a>
            </div>
        </div>
        {% endif %}
        
        <a href="{{ url_for('orders.dashboard') }}">
            <i class="bi bi-person"></i> Dashboard
        </a>
        
        <a href="{{ url_for('auth.logout') }}">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
        {% else %}
        <a href="{{ url_for('auth.login') }}">
            <i class="bi bi-box-arrow-in-right"></i> Login
        </a>
        <a href="{{ url_for('auth.register') }}">
            <i class="bi bi-person-plus"></i> Register
        </a>
        {% endif %}
    </div>
</div>
