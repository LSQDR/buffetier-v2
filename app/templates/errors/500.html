{% extends "base.html" %}
{% set show_navbar = True %}
{% set show_footer = False %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container text-center" style="padding: 100px 20px;">
    <div class="error-page">
        <h1 style="font-size: 120px; color: #e74c3c; margin: 0;">500</h1>
        <h2 style="color: #333; margin: 20px 0;">Internal Server Error</h2>
        <p style="color: #777; font-size: 18px; margin-bottom: 30px;">
            Something went wrong on our end. We're working to fix it!
        </p>
        <div style="margin-top: 40px;">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="margin: 5px;">
                <i class="bi bi-house"></i> Go Home
            </a>
            <button onclick="location.reload()" class="btn btn-secondary" style="margin: 5px;">
                <i class="bi bi-arrow-clockwise"></i> Try Again
            </button>
        </div>
        <div style="margin-top: 50px; font-size: 100px; opacity: 0.1;">
            ⚠️
        </div>
    </div>
</div>
{% endblock %}
