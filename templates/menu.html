<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu - Buffetier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1000px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
        }
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .menu-item {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .menu-item h3 {
            color: #3498db;
            margin-top: 0;
        }
        .price {
            font-size: 24px;
            font-weight: bold;
            color: #27ae60;
        }
        .category {
            display: inline-block;
            padding: 5px 10px;
            background-color: #ecf0f1;
            border-radius: 3px;
            font-size: 12px;
            margin-bottom: 10px;
        }
        .back-btn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #95a5a6;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        .back-btn:hover {
            background-color: #7f8c8d;
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn">← Back to Home</a>
    
    <h1>🍽️ Our Menu</h1>
    
    <div class="menu-grid">
        {% for item in items %}
        <div class="menu-item">
            <span class="category">{{ item.category }}</span>
            <h3>{{ item.name }}</h3>
            <p>{{ item.description }}</p>
            <div class="price">£{{ "%.2f"|format(item.price) }}</div>
        </div>
        {% endfor %}
    </div>
    
    {% if not items %}
    <p style="text-align: center; color: #7f8c8d; margin-top: 50px;">
        No menu items available at the moment.
    </p>
    {% endif %}
</body>
</html>
